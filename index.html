<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיקת מחיר ללקוח</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #0056b3;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    /* 16px חובה כדי למנוע Auto-Zoom באייפון */
    input, textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      height: 100px;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }
    button:hover {
      background-color: #003d82;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      color: #d9534f;
      background-color: #f9dede;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      text-align: center;
    }
    .hidden {
      display: none;
    }
    .user-info {
      background: #eef2f5;
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .months-box {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      background: white;
    }
    .months-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .month-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 16px;
      background: #f4f7f6;
      cursor: pointer;
    }
    .month-chip input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      flex-shrink: 0;
    }
    .month-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 16px;
    }
    .month-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .select-all-row {
      border-bottom: 1px solid #eee;
      margin-bottom: 6px;
      padding-bottom: 8px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #0056b3;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .not-found {
      color: #d9534f;
      font-weight: bold;
    }
    .found {
      color: #28a745;
      font-weight: bold;
    }
    .month-badge {
      display: inline-block;
      background: #e7f0fb;
      color: #0056b3;
      border-radius: 4px;
      padding: 2px 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>בדיקת מחיר ללקוח</h2>

    <!-- מסך התחברות -->
    <div id="loginSection">
      <div id="loginError" class="error hidden"></div>
      <div class="form-group">
        <label for="username">שם משתמש:</label>
        <input type="text" id="username" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">סיסמה:</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>
      <button id="loginBtn" onclick="handleLogin()">התחבר</button>
    </div>

    <!-- מסך חיפוש (מוסתר בהתחלה) -->
    <div id="searchSection" class="hidden">
      <div class="user-info">
        <span id="welcomeText"></span>
        <button onclick="handleLogout()" style="width: auto; padding: 5px 10px; font-size: 14px; background-color: #6c757d;">התנתק</button>
      </div>

      <div id="searchError" class="error hidden"></div>

      <div class="form-group">
        <label>מחירונים (ניתן לבחור אחד, כמה, או הכל):</label>
        <div id="monthsBox" class="months-box">טוען...</div>
      </div>

      <div class="form-group">
        <label for="customersInput">מספרי לקוח (ניתן להזין מספר אחד או כמה מופרדים בפסיקים/שורה):</label>
        <textarea id="customersInput" placeholder="לדוגמה: 3974, 3977"></textarea>
      </div>
      <button id="searchBtn" onclick="handleSearch()">חפש מחירים</button>

      <div id="resultsContainer"></div>
    </div>
  </div>

  <script>
    // כתובת ה-Web App של Apps Script (הפרויקט הנפרד)
    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyf-JecNS9ZyReWG3_x8G6yFib-gcYRbs0GaSTQmfmQG30ILKH2tcJ-1IpnSDmM6cdI7A/exec';
    const SHEET_PREFIX = 'מחירים';

    // שליחת בקשה ל-Apps Script דרך GET (עוקף CORS, בניגוד ל-POST)
    async function callApi(params) {
      const url = new URL(EXEC_URL);
      Object.keys(params).forEach(function (key) {
        if (params[key] !== undefined && params[key] !== null) {
          url.searchParams.set(key, params[key]);
        }
      });
      const res = await fetch(url.toString());
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      return res.json();
    }

    // הופך "מחירים 8.26" ל-"8.26", ו"מחירים" (בלי המשך) ל-"נוכחי"
    function sheetLabel(name) {
      const trimmed = String(name || '').trim();
      if (trimmed === SHEET_PREFIX) return 'נוכחי';
      if (trimmed.indexOf(SHEET_PREFIX) === 0) {
        const rest = trimmed.substring(SHEET_PREFIX.length).trim();
        return rest.length > 0 ? rest : 'נוכחי';
      }
      return trimmed;
    }

    window.onload = function() {
      const savedUser = sessionStorage.getItem('username');
      const savedPass = sessionStorage.getItem('password');
      if (savedUser && savedPass) {
        document.getElementById('username').value = savedUser;
        document.getElementById('password').value = savedPass;
        handleLogin();
      }
    };

    // הופך תווית כמו "8.26" למספר בר-השוואה (2608), כדי למיין מהחדש לישן.
    // תוויות לא-מספריות (כמו "נוכחי") נחשבות "העדכניות ביותר"
    function monthKey(label) {
      const m = String(label || '').trim().match(/^(\d{1,2})\.(\d{2,4})$/);
      if (m) {
        let month = parseInt(m[1], 10);
        let year = parseInt(m[2], 10);
        if (year < 100) year += 2000;
        return year * 100 + month;
      }
      return Infinity;
    }

    async function loadMonths() {
      const box = document.getElementById('monthsBox');
      box.innerHTML = 'טוען...';
      try {
        const response = await callApi({ action: 'months' });
        let months = (response.ok && response.months) ? response.months : [SHEET_PREFIX];

        // מיון מהחדש לישן לפי התווית (8.26 לפני 7.26 וכו')
        months = months.slice().sort(function (a, b) {
          return monthKey(sheetLabel(b)) - monthKey(sheetLabel(a));
        });

        let html = `
          <div class="month-item select-all-row">
            <input type="checkbox" id="selectAllMonths" onchange="toggleAllMonths()">
            <label for="selectAllMonths" style="margin:0;">בחר הכל</label>
          </div>
        `;
        months.forEach(function (name, idx) {
          const id = 'month_' + idx;
          const isLatest = idx === 0; // ברירת מחדל: רק החודש האחרון מסומן
          html += `
            <div class="month-item">
              <input type="checkbox" class="monthCheckbox" id="${id}" value="${name}" ${isLatest ? 'checked' : ''}>
              <label for="${id}" style="margin:0;">${sheetLabel(name)}</label>
            </div>
          `;
        });
        box.innerHTML = html;
      } catch (err) {
        box.innerHTML = `
          <div class="month-item">
            <input type="checkbox" class="monthCheckbox" value="${SHEET_PREFIX}" checked>
            <label style="margin:0;">נוכחי</label>
          </div>
        `;
      }
    }

    function toggleAllMonths() {
      const selectAll = document.getElementById('selectAllMonths').checked;
      document.querySelectorAll('.monthCheckbox').forEach(function (cb) {
        cb.checked = selectAll;
      });
    }

    function getSelectedMonths() {
      const checked = [];
      document.querySelectorAll('.monthCheckbox').forEach(function (cb) {
        if (cb.checked) checked.push(cb.value);
      });
      return checked;
    }

    async function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      if (!user || !pass) {
        errorDiv.innerText = 'יש להזין שם משתמש וסיסמה.';
        errorDiv.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'מתחבר...';

      try {
        const response = await callApi({ action: 'login', username: user, password: pass });

        if (response.ok) {
          sessionStorage.setItem('username', user);
          sessionStorage.setItem('password', pass);

          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('searchSection').classList.remove('hidden');
          document.getElementById('welcomeText').innerText =
            'שלום, ' + response.name + ' (' + (response.access === 'הכל' ? 'מנהל / הכל' : 'משווק') + ')';
          errorDiv.classList.add('hidden');

          await loadMonths();
        } else {
          errorDiv.innerText = response.message;
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.innerText = 'שגיאת תקשורת מול השרת.';
        errorDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'התחבר';
      }
    }

    function handleLogout() {
      sessionStorage.clear();
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('customersInput').value = '';
      document.getElementById('monthsBox').innerHTML = '';
      document.getElementById('searchSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('resultsContainer').innerHTML = '';
    }

    async function handleSearch() {
      const user = sessionStorage.getItem('username');
      const pass = sessionStorage.getItem('password');
      const rawInput = document.getElementById('customersInput').value;
      const selectedMonths = getSelectedMonths();
      const errorDiv = document.getElementById('searchError');
      const btn = document.getElementById('searchBtn');

      const customerNumbers = rawInput.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);

      if (customerNumbers.length === 0) {
        errorDiv.innerText = 'יש להזין לפחות מספר לקוח אחד.';
        errorDiv.classList.remove('hidden');
        return;
      }
      if (selectedMonths.length === 0) {
        errorDiv.innerText = 'יש לבחור לפחות מחירון אחד.';
        errorDiv.classList.remove('hidden');
        return;
      }

      errorDiv.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = 'מחפש...';

      try {
        const response = await callApi({
          action: 'lookup',
          username: user,
          password: pass,
          customers: customerNumbers.join(','),
          sheets: selectedMonths.join(',')
        });

        if (!response.ok) {
          errorDiv.innerText = response.message;
          errorDiv.classList.remove('hidden');
          return;
        }
        renderResults(response.results);
      } catch (err) {
        errorDiv.innerText = 'שגיאה בביצוע החיפוש.';
        errorDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'חפש מחירים';
      }
    }

    function compareCustomers(a, b) {
      const na = Number(a);
      const nb = Number(b);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return String(a).localeCompare(String(b));
    }

    function renderResults(results) {
      const container = document.getElementById('resultsContainer');
      if (!results || results.length === 0) {
        container.innerHTML = '<p>לא נמצאו תוצאות.</p>';
        return;
      }

      // מיון: לפי מספר לקוח עולה, ובתוך אותו לקוח - מהחודש האחרון לישן
      results = results.slice().sort(function (a, b) {
        const byCustomer = compareCustomers(a.customer, b.customer);
        if (byCustomer !== 0) return byCustomer;
        return monthKey(b.label) - monthKey(a.label);
      });

      let html = `
        <table>
          <thead>
            <tr>
              <th>מספר לקוח</th>
              <th>מחירון</th>
              <th>סטטוס</th>
              <th>מחיר חוץ</th>
              <th>מחיר דלקנים</th>
            </tr>
          </thead>
          <tbody>
      `;

      results.forEach(item => {
        const statusClass = item.found ? 'found' : 'not-found';
        const statusText = item.found ? 'נמצא' : 'לא נמצא';
        html += `
          <tr>
            <td><strong>${item.customer}</strong></td>
            <td><span class="month-badge">${item.label || ''}</span></td>
            <td class="${statusClass}">${statusText}</td>
            <td>${item.outsidePrice || '-'}</td>
            <td>${item.fuelPrice || '-'}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }
  </script>
</body>
</html>
